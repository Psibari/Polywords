name: Wire rematch production presentation

'on':
  push:
    branches: [play-screen-overhaul]
    paths:
      - .github/workflows/rematch-production-wire.yml
      - tools/dev/wire-rematch-production.py

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: play-screen-overhaul
          fetch-depth: 0

      - name: Apply production wiring
        run: python tools/dev/wire-rematch-production.py

      - name: Verify production wiring
        run: |
          node app/components/rematchOutcomePresentation.test.mjs
          npx tsc --noEmit

      - name: Commit production wiring
        run: |
          git config user.name "Psibari"
          git config user.email "167714157+Psibari@users.noreply.github.com"
          git add app/components/MaskBoard.tsx
          git commit -m "feat: wire king buster into production rematch"
          git push origin HEAD:play-screen-overhaul
