name: Apply boss outcome cleanup

'on':
  push:
    branches: [play-screen-overhaul]
    paths:
      - .github/workflows/boss-outcome-cleanup.yml
      - tools/dev/apply-boss-outcome-cleanup.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: play-screen-overhaul
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Apply cleanup
        run: python tools/dev/apply-boss-outcome-cleanup.py

      - name: Verify cleanup contract
        run: |
          node app/components/rematchOutcomePresentation.test.mjs
          npm run typecheck

      - name: Commit cleanup
        run: |
          git config user.name "Psibari"
          git config user.email "167714157+Psibari@users.noreply.github.com"
          git add app/hooks/useBoardMechanics.ts app/components/MaskBoard.tsx app/ui/plaqueTextMaterial.ts
          git commit -m "feat: clean up boss outcome presentation"
          git push origin HEAD:play-screen-overhaul
